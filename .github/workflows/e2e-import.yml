name: E2E Import

on:
  push:
  pull_request:

jobs:
  e2e-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Next dev
        run: npm run dev &

      - name: Wait for server
        run: |
          for i in {1..60}; do
            if curl -sS http://localhost:3000/dashboard/configuracion/datos >/dev/null; then
              echo "Server is up" && break
            fi
            echo "Waiting for server...";
            sleep 2;
          done

      - name: Run E2E import script
        run: npm run test:e2e

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test-artifacts/**
